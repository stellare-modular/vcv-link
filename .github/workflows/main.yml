name: Build VCV Link Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y build-essential curl unzip

      - name: Set up dependencies (Windows only)
        if: matrix.os == 'windows-latest'
        run: choco install unzip

      - name: Download VCV Rack SDK
        run: |
          export RACK_SDK_VERSION=2.4.1
          export RACK_SDK_URL="https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-${{ matrix.os == 'windows-latest' && 'win' || matrix.os == 'macos-latest' && 'mac' || 'lin' }}.zip"
          echo "Downloading from $RACK_SDK_URL"
          curl -L "$RACK_SDK_URL" -o rack-sdk.zip
          unzip rack-sdk.zip -d rack-sdk
          mv rack-sdk/Rack-SDK-* rack-sdk/Rack-SDK
          echo "RACK_SDK=$(pwd)/rack-sdk/Rack-SDK" >> $GITHUB_ENV

      - name: Show SDK location
        run: echo "Using RACK_SDK at $RACK_SDK"

      - name: Build plugin
        run: |
          make clean
          make dist

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v3
        with:
          name: vcv-link-${{ matrix.os }}
          path: dist/*.vcvplugin
